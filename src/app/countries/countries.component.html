<h1>Countries</h1>
<p>Here's a list of countries: feel free to play with it.</p>
<a routerLink="/countryedit/0" mat-button="" mat-flat-button color="primary">Create New Country</a>
  <table class='table table-striped' aria-labelledby="tableLabel">
    <thead>
      <tr>
        <th></th>
        <th>ID</th>
        <th>Name</th>
        <th>ISO2</th>
        <th>ISO3</th>
      </tr>
    </thead>
    <tbody>
      @for (country of countries(); track country.id) {
          <tr>
            <td>
              <a [routerLink]="['/countryedit', country.id]"><mat-icon>edit</mat-icon></a>
              <a [routerLink]="['/citiesincountry', country.id]"><mat-icon>list</mat-icon></a>
            </td>
            <td><a [routerLink]="['/countrypopulation', country.id]"> {{ country.id }}</a></td>
            <td>{{ country.name }}</td>
            <td>{{ country.iso2 }}</td>
            <td>{{ country.iso3 }}</td>
          </tr>
      }
    </tbody>
  </table>
